name: Validate PR 56967 gates on official cu129 image

on:
  push:
    branches:
      - codex/validate-pr-56967-parent-image
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: vllm/vllm-openai@sha256:e16bac51452d79587ede476ad7fe36353f5379d2eb5a1dac6a0eb48f7fac0ea8
    steps:
      - name: Confirm CPU-only runner
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = x86_64
          if compgen -G '/dev/nvidia*' >/dev/null; then
            echo 'Unexpected NVIDIA devices'
            ls -l /dev/nvidia*
            exit 1
          fi
          echo 'No NVIDIA devices'

      - name: Inspect pinned official cu129 release manifest
        run: docker manifest inspect "$IMAGE"

      - name: Pull official cu129 image and record digest
        id: pull
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE"
          df -h /

      - name: PR gate 1 - torch-family invariant
        id: family
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        run: |
          docker run --rm --entrypoint bash "$IMAGE" -lc '
          set -euxo pipefail
          cat /vllm-workspace/torch_lib_versions.txt
          uv pip freeze --system \
            | grep -i "^torch=\|^torchvision=\|^torchaudio=" \
            | diff -u /vllm-workspace/torch_lib_versions.txt -
          '

      - name: PR gate 2 - dependency consistency
        id: dependencies
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        run: docker run --rm --entrypoint bash "$IMAGE" -lc 'uv pip check --system'

      - name: PR gate 3 - exact imports
        id: imports
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        run: |
          docker run --rm --entrypoint python3 "$IMAGE" -c \
            'import torch, torchvision, torchvision.ops, torchaudio, vllm'

      - name: Stronger binary and CPU-only import evidence
        id: binary
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        run: |
          docker run --rm -i --entrypoint python3 "$IMAGE" - <<'PY'
          import torch
          import torchvision
          import torchaudio
          import vllm

          print("torch:", torch.__version__)
          print("torch.version.cuda:", torch.version.cuda)
          print("torch.cuda.is_available():", torch.cuda.is_available())
          print("torchvision:", torchvision.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("vllm:", vllm.__version__)
          print("vllm path:", vllm.__file__)
          import vllm._C_stable_libtorch
          print("vllm._C_stable_libtorch: OK")
          assert torch.version.cuda == "12.9"
          assert torch.cuda.is_available() is False
          PY

      - name: Summarize all gate outcomes
        if: ${{ always() }}
        env:
          PULL_RESULT: ${{ steps.pull.outcome }}
          FAMILY_RESULT: ${{ steps.family.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          IMPORTS_RESULT: ${{ steps.imports.outcome }}
          BINARY_RESULT: ${{ steps.binary.outcome }}
        run: |
          printf '%s\n' \
            "Image: $IMAGE" \
            "Pull: $PULL_RESULT" \
            "Torch family: $FAMILY_RESULT" \
            "Dependency check: $DEPENDENCIES_RESULT" \
            "Exact imports: $IMPORTS_RESULT" \
            "Binary imports: $BINARY_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$PULL_RESULT" = success
          test "$FAMILY_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
          test "$IMPORTS_RESULT" = success
          test "$BINARY_RESULT" = success
